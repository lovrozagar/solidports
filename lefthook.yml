# This repo's hooks: the shared ones from lefthook.base.yml (managed by ~/Development/standards) plus this repo's own
# jobs below. Edit this file by hand.
extends:
  - lefthook.base.yml

pre-commit:
  jobs:
    # Base UI lints with upstream's ESLint stack (D2 moves it to oxlint), which the shared oxlint jobs
    # do not run: check the staged Solid library and docs files with it before the commit lands.
    - name: base-ui-eslint
      root: "packages/base-ui/"
      glob: "**/{packages/solid,docs/solid}/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: bunx eslint --report-unused-disable-directives --max-warnings 0 --no-warn-ignored {staged_files}
    # The scripts suite pins the bench manifest, the context map, the workflow steps and the gate
    # scripts to the code they describe; the verify stamp runs it, the commit did not. A commit
    # that touches one of its inputs runs it, so a renamed cost test fails here, not at the stamp.
    - name: scripts-suite
      glob:
        - "scripts/**"
        - "packages/base-ui/test/perf-solid/**"
        - "packages/base-ui/scripts/**"
        - "**/*.cost.test.tsx"
        - "packages/base-ui/context/**"
        - ".github/workflows/**"
      run: bun test ./scripts

pre-push:
  jobs:
    # CI installs the Bun `package.json` pins; a local Bun of another version can pass the scripts
    # suite where CI fails it. Run it under the pinned version when they differ.
    - name: scripts-on-pinned-bun
      run: bun scripts/pinned-bun-test.ts
