name: Release base-ui

on:
  push:
    tags:
      - "base-ui-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. base-ui-v1.8.0-1). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-base-ui-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  PACKAGE_NAME: "@solidports/base-ui"
  PACKAGE_DIR: packages/base-ui/packages/solid
  TAG_PREFIX: "base-ui-v"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck (emits declarations into types/)
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          bun run types
          bunx tsc -p tsconfig.test.json --noEmit
      - run: bun run lint
      - name: Test (jsdom)
        working-directory: packages/base-ui
        run: bun run test:solid:jsdom --maxWorkers=2
      - name: Install Chromium
        working-directory: packages/base-ui
        run: bunx playwright install --with-deps chromium
      - name: Test (Chromium)
        working-directory: packages/base-ui
        run: bun run test:solid:chromium --maxWorkers=2

  npmjs:
    name: npmjs.com
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Check tag matches package.json
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#"$TAG_PREFIX"}"
          pkg="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if [ "$ref" = "$tag" ] || [ "$tag" != "$pkg" ]; then
            echo "tag $ref does not match ${PACKAGE_DIR}/package.json version $pkg (expected ${TAG_PREFIX}${pkg})"
            exit 1
          fi
      - name: Publish to registry.npmjs.org
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          version="${ref#"$TAG_PREFIX"}"
          name="${PACKAGE_NAME}"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$name")"

          # Prereleases (1.8.0-1) go to `next`; only bare upstream versions take `latest`.
          if [[ "$version" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "npm already has ${name}@${version} — skipping"
            exit 0
          fi

          # `bun pm pack` resolves the `catalog:` dependency specs; `npm pack` would publish them as-is.
          # `prepack` emits the declarations into types/.
          bun pm pack --destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/*.tgz)"
          if tar -xOzf "$tarball" package/package.json | grep -qE '"(catalog|workspace):'; then
            echo "packed package.json still has catalog:/workspace: specs"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request URL/token missing — id-token: write is not in effect"
            exit 1
          fi
          audience="$(node -p 'encodeURIComponent("npm:registry.npmjs.org")')"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            -o /tmp/oidc.json
          node -e 'const j=require("/tmp/oidc.json"); if(!j.value) process.exit(2)'

          oidc_jwt="$(node -e 'process.stdout.write(require("/tmp/oidc.json").value)')"
          code=$(curl -sS -o /tmp/npm-ex.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${oidc_jwt}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")
          echo "oidc exchange HTTP $code"
          node -e 'const j=require("/tmp/npm-ex.json"); console.log(JSON.stringify({error:j.error,message:j.message,token_type:j.token_type,expires:j.expires}))'
          if [ "$code" != "201" ]; then
            echo "npm rejected the GitHub OIDC token."
            echo "On https://www.npmjs.com/package/${name} → Settings → Trusted Publisher"
            echo "the saved connection must be exactly:"
            echo "  GitHub Actions / lovrozagar / solidports / release-base-ui.yml / environment empty / allow npm publish"
            exit 1
          fi
          NODE_AUTH_TOKEN="$(node -e 'process.stdout.write(require("/tmp/npm-ex.json").token || "")')"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "exchange succeeded but returned no token"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          set +e
          npm publish "$tarball" --access public --provenance --tag "$dist_tag"
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${version} is now on npm — treating as success"
            exit 0
          fi
          exit "$pub"
