name: Base UI tests

# Every suite upstream Base UI (mui/base-ui) runs in CI and locally, as its Solid counterpart: one job
# per upstream job, so each reports on its own. Runs on every push to main, on pull requests, on
# demand, and from the release workflow before a Base UI publish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to test (tag, branch or SHA). Empty = the dispatching ref."
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Every pushed commit gets its own run; a pull request keeps only its newest one.
concurrency:
  group: base-ui-tests-${{ github.event_name == 'pull_request' && github.ref || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.3.11"

jobs:
  # Upstream "JSDOM tests"
  jsdom:
    name: JSDOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The package tests (`test/package`) check each export's declaration file in `types/`.
      - working-directory: packages/base-ui/packages/solid
        run: bun run types
      - working-directory: packages/base-ui
        run: bun run test:solid:jsdom --run --maxWorkers=2

  # Upstream "Browser tests" (Chromium); Firefox and WebKit are upstream's local test:browsers
  # Upstream runs its browser suite in Chromium only. Firefox and WebKit run in the browser parity
  # workflow, which compares the Solid suite with upstream's there.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - working-directory: packages/base-ui
        run: bun run test:solid:chromium --run --maxWorkers=2

  # Upstream "Screen Reader (Windows / NVDA)": upstream's screen reader specs against the Solid e2e app
  screen-reader:
    name: Screen Reader (Windows / NVDA)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - working-directory: packages/base-ui
        run: bunx guidepup install
      - working-directory: packages/base-ui
        run: bunx playwright test --config test/screen-reader-solid/playwright.config.ts

  # Upstream "E2E tests"
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - working-directory: packages/base-ui
        run: bun run test:e2e:solid

  # Upstream "Regression tests" (visual): React and Solid hosts, compared screenshot by screenshot
  regressions:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - working-directory: packages/base-ui
        run: |
          bun run test:regressions:solid:build
          bun run test:regressions:solid
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: packages/base-ui/test/regressions-solid/screenshots

  # Upstream "Linting"
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: format
        run: bun run fmt:check
      - name: oxlint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: eslint
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bunx eslint packages/solid/src packages/solid/test docs/solid/src --report-unused-disable-directives --max-warnings 0
      - name: eslint rule tests
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bun run test:lint-rules
      - name: stylelint
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bunx stylelint --reportInvalidScopeDisables --reportNeedlessDisables 'docs/solid/**/*.css' --ignore-path .lintignore
      - name: vale
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bun run valelint

  # Upstream "Generated files verification"
  static:
    name: Generated files verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # @mui/internal-code-infra locates the workspace packages through pnpm, as upstream runs it.
      - run: npm install --global pnpm@10
      - name: error codes
        working-directory: packages/base-ui
        run: |
          bun run extract-error-codes
          git diff --exit-code
      - name: inline scripts
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: |
          git checkout -- .
          bun run inline-scripts
          git diff --exit-code
      - name: test parity with upstream (missing tests, skips, todos, expected failures)
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: node scripts/test-parity.mjs

  # Upstream "Typechecking"
  types:
    name: Typechecking
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - working-directory: packages/base-ui/packages/solid
        run: |
          bun run typescript
          bunx tsc -p tsconfig.test.json --noEmit
      - working-directory: packages/base-ui/docs/solid
        run: bun run typescript --noEmit

  # Upstream "Package verification"
  package:
    name: Package verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - working-directory: packages/base-ui/packages/solid
        run: |
          bun run types
          bun run test:built-types
          bun run test:package
      # Upstream's public type tests, ported: consumer code compiled against the built types.
      - working-directory: packages/base-ui/test/public-types-solid
        run: bun run release:test
      # Upstream's node-resolution test: every export path resolves in Node and loads in a server build.
      - working-directory: packages/base-ui/test/node-resolution-solid
        run: bun run test

  # Upstream "Validating Docs": docs-infra's validation of the generated docs (their API tables and
  # indexes are committed), then the production build upstream's deploy previews run
  docs:
    name: Validating Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: validate
        working-directory: packages/base-ui
        run: |
          bun run docs:validate
          git diff --exit-code
      - name: build
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bun run docs:build

  # Upstream "Benchmark tests"
  benchmark:
    name: Benchmark tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - working-directory: packages/base-ui
        run: |
          bun run bench:solid:build
          bun run bench:solid
