name: Base UI tests

# The release job's base-ui checks, run on demand against any ref without publishing. Every step
# runs even after an earlier one fails, so one run reports every failure before a release is tagged.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  test:
    name: base-ui
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: typecheck and package check (emits declarations into types/)
        working-directory: packages/base-ui/packages/solid
        run: |
          bun run types
          bunx tsc -p tsconfig.test.json --noEmit
          bun run test:package
      - name: tests (jsdom)
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: bun run test:solid:jsdom --maxWorkers=2
      - name: tests (Chromium)
        if: ${{ !cancelled() }}
        working-directory: packages/base-ui
        run: |
          bunx playwright install --with-deps chromium
          bun run test:solid:chromium --maxWorkers=2
