name: Base UI browser parity

# Runs upstream's React suite and the Solid suite in each browser and reports the Solid failures of
# tests upstream passes there (`scripts/browser-parity.mjs`). Upstream's CI only runs Chromium, so
# its Firefox and WebKit results are what a Solid failure there is measured against. Every push to
# main runs Firefox and WebKit, which the Base UI tests workflow leaves out as upstream's CI does;
# a dispatch runs all three browsers.
on:
  push:
    branches: [main]
    paths:
      - "packages/base-ui/**"
      - ".github/workflows/base-ui-browser-parity.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to test (tag, branch or SHA). Empty = the dispatching ref."
        required: false
        default: ""

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  parity:
    name: Browser parity (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'push' && '["firefox","webkit"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: upstream (React)
        working-directory: packages/base-ui
        continue-on-error: true
        run: bun run test:${{ matrix.browser }} --run --maxWorkers=2 --reporter=json --outputFile=react-${{ matrix.browser }}.json
      - name: Solid
        working-directory: packages/base-ui
        continue-on-error: true
        run: bun run test:solid:${{ matrix.browser }} --run --maxWorkers=2 --reporter=json --outputFile=solid-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: browser-reports-${{ matrix.browser }}
          path: packages/base-ui/*-${{ matrix.browser }}.json
      - name: compare
        working-directory: packages/base-ui
        run: node scripts/browser-parity.mjs react-${{ matrix.browser }}.json solid-${{ matrix.browser }}.json
