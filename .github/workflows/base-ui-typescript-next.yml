name: Base UI typescript@next

# Upstream "Typechecking (typescript@next)": nightly, typechecks the package with the next
# TypeScript release and logs the built declaration files it rejects without failing on them.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.3"

jobs:
  types-next:
    name: Typechecking (typescript@next)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - working-directory: packages/base-ui/packages/solid
        run: bunx --package typescript@next tsc -b tsconfig.json
      - name: Log defect declaration files
        working-directory: packages/base-ui/packages/solid
        run: |
          set +e
          bun run types
          bun run test:built-types
          exit 0
